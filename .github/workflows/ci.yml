name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        # Pas --fix ici : le script npm réécrit les fichiers, une CI ne doit
        # que constater un échec, jamais committer à la place de quelqu'un.
        run: npx eslint .

      - name: Build and prerender
        run: npm run generate

      - name: Smoke tests (Puppeteer, headless)
        run: npm run smoke
